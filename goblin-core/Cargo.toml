[package]
name = "goblin-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
goblin-macros = { path = "../goblin-macros" }
keccak-const = "0.2.0"
hex-literal = "0.4.1"

[dev-dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[features]
default = ["localnet"]
localnet = []
testnet = []
mainnet = []
