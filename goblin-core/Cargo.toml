[package]
name = "goblin-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
goblin-hostio = { path = "../goblin-hostio" }
goblin-macros = { path = "../goblin-macros" }
keccak-const = "0.2.0"
hex-literal = "0.4.1"

# The integration tests exercise the full `entrypoint()` path, which needs the
# calldata encoder (`encode`) and the native hostio emulation (`test-hostio`).
# Depending on ourselves is how we turn on our own `encode` feature for test
# targets without enabling it for normal builds (in particular, wasm).
[dev-dependencies]
goblin-core = { path = ".", features = ["encode"] }
goblin-hostio = { path = "../goblin-hostio", features = ["test-hostio"] }
# Used by integration tests to derive call selectors and encode mock return
# values from Solidity interfaces instead of hand-rolling the ABI.
alloy-sol-types = "1"

[features]
default = ["localnet"]
encode = []
localnet = []
testnet = []
mainnet = []
