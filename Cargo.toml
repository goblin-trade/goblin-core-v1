cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "2"
members = [
    "goblin-core",
    "goblin-hostio",
    "goblin-macros",
    "goblin-program",
    "goblin-scripts-rs",
    "goblin-tests",
    "goblin-types"
]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "immediate-abort"
